<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgewright Dashboard</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 32px; background: #0f172a; color: #e2e8f0; }
    a { color: #93c5fd; }
    .card { background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin: 12px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border-bottom: 1px solid #334155; padding: 8px; text-align: left; vertical-align: top; }
    th { color: #bfdbfe; }
  </style>
</head>
<body>
  <h1>Forgewright Dashboard</h1>
  <div id="summary" class="card"></div>
  <table>
    <thead><tr><th>Scope</th><th>Title</th><th>Source</th><th>Confidence</th><th>Action</th><th>Evidence</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script id="payload" type="application/json">{}</script>
  <script>
    // Render-side hardening (hsf_34adf05df3361a020877e1d1): no innerHTML with
    // payload-derived strings; DOM text nodes only, and hrefs restricted to
    // http(s) schemes. All payload content is treated as untrusted text.
    const SAFE_URL = /^(https?:\/\/)/i;
    const payload = JSON.parse(document.getElementById('payload').textContent || '{}');
    function setText(id, nodes) {
      const el = document.getElementById(id);
      el.textContent = '';
      el.append(...nodes);
    }
    function text(value) { return document.createTextNode(String(value ?? '')); }
    function safeHref(raw) {
      const s = String(raw || '').trim();
      return SAFE_URL.test(s) ? s : null;
    }
    const rows = [];
    for (const [scope, items] of Object.entries(payload.account_results || {})) {
      for (const item of items || []) rows.push({ scope, ...item });
    }
    for (const item of payload.global_results || []) rows.push({ scope: 'Global', ...item });

    const summary = [];
    summary.push(text('Generated: '));
    summary.push(text(payload.generated_at || payload.generated || 'n/a'));
    summary.push(text('  Signals: ' + rows.length));
    summary.push(text('  Empty cases: ' + (payload.empty_cases || []).length));
    setText('summary', summary);

    const tbody = document.getElementById('rows');
    tbody.textContent = '';
    for (const item of rows) {
      const tr = document.createElement('tr');
      tr.append(text(item.scope || ''));
      const tdTitle = document.createElement('td');
      tdTitle.append(text(item.title || ''));
      tr.append(tdTitle);
      const tdSource = document.createElement('td');
      const href = safeHref(item.url);
      if (href) {
        const a = document.createElement('a');
        a.href = href;
        a.rel = 'noopener noreferrer';
        a.append(text(item.source_name || item.source_tier || item.url || ''));
        tdSource.append(a);
      } else {
        tdSource.append(text(item.source_name || item.source_tier || item.url || ''));
      }
      tr.append(tdSource);
      tr.append(text(item.confidence || ''));
      tr.append(text(item.recommended_action || ''));
      tr.append(text(item.screenshot || ''));
      tbody.append(tr);
    }
  </script>
</body>
</html>
